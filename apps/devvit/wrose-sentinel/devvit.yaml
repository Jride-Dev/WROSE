name: wrose-sentinel
version: 0.1.0
versionName: Phase 2 MVP
description: >
  Moderator intelligence assistant for WROSE.
  Analyzes thread signals and volatility.
  Requires a self-hosted WROSE backend.
  Analytical only — no automated moderation.
author: WROSE
scope: Post
permissions:
  http:
    domains:
      - unwomanly-myspace-cleat.ngrok-free.dev
dependencies:
  - "@devvit/public-api"
settings:
  - name: wroseApiBaseUrl
    label: WROSE API Base URL
    type: string
    defaultValue: http://127.0.0.1:8000
    scope: app
  - name: wroseSafetyStatement
    label: Safety Notice (read-only)
    type: string
    defaultValue: "No automated action was taken. WROSE Sentinel is analytical only."
    scope: app
